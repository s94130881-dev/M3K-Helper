name: Android CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Show Java and Gradle versions
        run: |
          java -version
          ./gradlew --version

      - name: Clean
        run: ./gradlew clean

      - name: Compile Kotlin Release
        run: ./gradlew :app:compileReleaseKotlin --stacktrace --info

      - name: Build Release APK
        run: ./gradlew :app:assembleRelease --stacktrace --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: M3K-Helper-release
          path: app/build/outputs/apk/release/*.apk
