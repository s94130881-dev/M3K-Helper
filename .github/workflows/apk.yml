name: Build M3K Helper APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Dar permissão ao Gradle
        run: chmod +x ./gradlew

      - name: Verificar Gradle
        run: ./gradlew --version

      - name: Limpar projeto
        run: ./gradlew clean

      - name: Compilar APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Procurar APKs
        run: |
          echo "APKs encontrados:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Enviar APKs
        uses: actions/upload-artifact@v4
        with:
          name: M3K-Helper-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
